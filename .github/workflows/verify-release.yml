name: Verify Grist Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: false
        default: v1.7.22
permissions:
  contents: read
concurrency:
  group: grist-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName --jq .tagName)"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download exact Release asset on runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSET_NAME="community.lazycat.app.grist-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import hashlib, json, os, tarfile, yaml

          tag = os.environ['RELEASE_TAG']
          name = os.environ['ASSET_NAME']
          pkg = __import__('pathlib').Path('verify-pkg') / name
          assert pkg.is_file(), pkg

          h = hashlib.sha256()
          with pkg.open('rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''):
                  h.update(chunk)

          with tarfile.open(pkg, 'r:') as package:
              members = package.getnames()
              for required in ('manifest.yml', 'package.yml', 'content.tar', 'icon.png'):
                  assert required in members, (required, members)

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.grist', info['package']
              assert info['name'] == 'Grist', info['name']
              assert info['version'] == tag.lstrip('v'), (info['version'], tag)
              assert info['license'] == 'Apache-2.0', info['license']
              assert info['min_os_version'] == '1.5.0', info['min_os_version']

              m = yaml.safe_load(package.extractfile('manifest.yml').read())
              app = m['application']
              assert app['subdomain'] == 'grist', app['subdomain']
              ups = app['upstreams']
              assert any(u['location'] == '/' and u['backend'] == 'http://grist:8484/' for u in ups), ups

              svcs = m['services']
              assert set(svcs) == {'grist'}, set(svcs)

              svc = svcs['grist']
              assert 'gristlabs/grist' in svc['image'], svc['image']
              assert svc['image'].endswith(':' + tag.lstrip('v')), svc['image']

              env = ' '.join(svc['environment'])
              # same-origin is required behind the https ingress, otherwise asset
              # and API URLs are rewritten to the container's internal address
              assert 'GRIST_SERVE_SAME_ORIGIN=true' in env, env
              assert 'GRIST_HOST=0.0.0.0' in env, env
              assert 'GRIST_DATA_DIR=/persist/docs' in env, env
              assert 'GRIST_INST_DIR=/persist' in env, env
              # default sandbox needs gVisor/seccomp privileges; pyodide runs in-process
              assert 'GRIST_SANDBOX_FLAVOR=pyodide' in env, env
              assert 'GRIST_ALLOW_AUTOMATIC_VERSION_CHECKING=false' in env, env

              # documents and the sqlite metadata live under /persist
              assert any(b.endswith(':/persist') for b in svc['binds']), svc['binds']

              # no built-in credential: admin comes from the first-run setup page
              assert 'deploy_params.yml' not in members, members
              # a single fixed identity would mean no authentication at all
              assert 'GRIST_DEFAULT_EMAIL' not in env, env

              assert 'healthcheck' not in svc, svc
              text = package.extractfile('manifest.yml').read().decode()
              assert 'lzc-file-chooser' not in text

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  cmembers = content.getnames()
                  lic = [n for n in cmembers if 'licenses/' in n]
                  assert lic, cmembers
                  main_lic = [n for n in lic if n.endswith('/LICENSE')]
                  target = main_lic[0] if main_lic else lic[0]
                  license_text = content.extractfile(target).read().decode()
              assert 'Apache License' in license_text and 'Version 2.0' in license_text

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
